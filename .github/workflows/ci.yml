name: 项目质量检查

on:
  push:
    branches:
      - main
      - feat/digital-xinyu-v2
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Python 测试（${{ matrix.runtime }}）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [core, cpu-model]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装核心依赖
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 安装 CPU 模型测试依赖
        if: matrix.runtime == 'cpu-model'
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu

      - name: 确认模型测试运行时
        if: matrix.runtime == 'cpu-model'
        run: python -c "import torch; assert torch.__version__.startswith('2.8.0'); assert not torch.cuda.is_available(); print(torch.__version__)"

      - name: 检查 Python 语法
        run: python -m compileall -q apps packages services tests

      - name: 运行单元测试
        env:
          DEEPSEEK_API_KEY: ""
          QWEN_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          TTS_API_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend-and-compose:
    name: 动作与部署配置检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 动作逻辑测试
        run: |
          node tests/avatar_gestures.cjs
          node tests/avatar_speech_sync.cjs
          node tests/tts_stream_lifecycle.cjs
          node tests/avatar_long_speech.cjs
          node tests/camera_quality.cjs
          node tests/camera_lifecycle.cjs
          node tests/text_send_reliability.cjs
          node tests/text_streaming.cjs
          node tests/voice_endpoint.cjs
          node tests/continuous_voice_lifecycle.cjs
          node tests/password_recovery_ui.cjs
          node tests/account_deletion_ui.cjs
          node tests/session_notes_ui.cjs
          node tests/knowledge_references.cjs
          node tests/knowledge_followup_ui.cjs
      - name: Compose静态校验（不展开密钥）
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
