name: 项目质量检查

on:
  push:
    branches:
      - main
      - feat/digital-xinyu-v2
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Python 核心测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装核心依赖
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 检查 Python 语法
        run: python -m compileall -q apps packages services tests

      - name: 运行单元测试
        env:
          DEEPSEEK_API_KEY: ""
          QWEN_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          TTS_API_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py"
