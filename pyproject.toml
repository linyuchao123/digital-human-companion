[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-xinyu"
version = "0.1.0"
description = "数字心屿：基于智能体工作流的 AI 情绪陪伴数字人"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "bcrypt>=4.2,<6.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "websockets>=13,<18",
]

[project.optional-dependencies]
agent = [
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "psycopg[binary,pool]>=3.2,<4.0",
]
cloud = [
  "dashscope>=1.25,<2.0",
  "openai>=2.0,<3.0",
]
vision = [
  "mediapipe>=0.10,<1.0",
  "opencv-contrib-python>=4.8,<5.0",
  "protobuf>=3.20,<6.0",
]
speech = [
  "funasr>=1.0,<2.0",
  "kaldi-native-fbank>=1.22,<2.0",
  "librosa>=0.10,<1.0",
  "modelscope>=1.14,<2.0",
  "opensmile>=2.5,<3.0",
  "sounddevice>=0.5,<1.0",
]
ml = [
  "accelerate>=0.30,<2.0",
  "datasets>=2.19,<5.0",
  "torch>=2.2,<3.0",
  "torchaudio>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "transformers>=4.41,<6.0",
]
rag = [
  "chromadb>=0.5,<2.0",
  "jieba>=0.42,<1.0",
  "sentence-transformers>=2.6,<6.0",
  "tiktoken>=0.7,<1.0",
]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
