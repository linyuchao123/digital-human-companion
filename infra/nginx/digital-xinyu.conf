server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://xiaolinyx.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name xiaolinyx.cloud www.xiaolinyx.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://xiaolinyx.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.xiaolinyx.cloud;

    ssl_certificate /etc/letsencrypt/live/xiaolinyx.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaolinyx.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://xiaolinyx.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xiaolinyx.cloud;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/xiaolinyx.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaolinyx.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
