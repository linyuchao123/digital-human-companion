# =============================================
# 数智心伴 - AI数字人情感陪护系统
# Docker Compose 一键编排
# =============================================
# 【启动前准备】
#   1. 复制环境变量：cp .env.example .env
#   2. 编辑 .env 填入 DeepSeek、千问与 TTS 所需 API Key
#
# 【常用命令】
#   启动所有服务：  docker-compose up -d
#   查看运行日志：  docker-compose logs -f
#   停止服务：      docker-compose down
#   重新构建：      docker-compose up -d --build
#
# 【访问地址】
#   主界面（数字人对话）：http://localhost:8800/
#   ASR评测页面不在生产容器自动启动，需要开发时单独启动
# =============================================

services:
  # ── 主服务（对话 + 数字人驱动 + 视觉监控） ────────
  app:
    build:
      context: ../../          # 项目根目录（相对于此文件所在位置）
      dockerfile: infra/docker/Dockerfile
    image: shuzhixinban:latest
    container_name: shuzhixinban-main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8800:8800"  # 仅本机发布，由HTTPS反向代理对外服务
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PUBLIC_DEPLOYMENT=true
      - OAUTH_PUBLIC_BASE_URL=${OAUTH_PUBLIC_BASE_URL:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - QQ_APP_ID=${QQ_APP_ID:-}
      - QQ_APP_SECRET=${QQ_APP_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURITY=${SMTP_SECURITY:-ssl}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - EMAIL_VERIFICATION_SECRET=${EMAIL_VERIFICATION_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://127.0.0.1:8800,http://localhost:8800}
      # 对话模型：DeepSeek 主模型 → 千问备用模型 → 离线兜底
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      - ASR_MODEL=${ASR_MODEL:-paraformer-zh}
      - ASR_DEVICE=${ASR_DEVICE:-cpu}
      - ASR_PROVIDER=${ASR_PROVIDER:-funasr}
      - ASR_API_KEY=${ASR_API_KEY:-}
      - ASR_CLOUD_MODEL=${ASR_CLOUD_MODEL:-qwen-audio-3.0-asr-flash}
      - ASR_CLOUD_URL=${ASR_CLOUD_URL:-https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
      - ASR_FALLBACK_LOCAL=${ASR_FALLBACK_LOCAL:-true}
      - ASR_HOTWORDS=${ASR_HOTWORDS:-小安 数字心屿}
      # 语音模型使用独立密钥；共用 DashScope 密钥仍作为兼容回退项
      - TTS_API_KEY=${TTS_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - TTS_PROVIDER=${TTS_PROVIDER:-auto}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-qwen3_tts:Chelsie}
      - TTS_QWEN3_MODEL=${TTS_QWEN3_MODEL:-qwen3-tts-instruct-flash}
      - TTS_RATE=${TTS_RATE:-185}
      # 模型和受保护知识库管理
      - RAG_EMBEDDING_MODEL_PATH=/app/models/embedding/bge-small-zh-v1.5
      - RAG_ADMIN_TOKEN=${RAG_ADMIN_TOKEN:-}
      - DEVICE=${DEVICE:-cpu}
      - PYTHONUNBUFFERED=1
      - MODELSCOPE_CACHE=/app/cache/modelscope
    volumes:
      # 持久化用户数据库（重启容器后不丢失会话记录）
      - app-data:/app/data
      # 数字人面部行为驱动模型（体积大，挂载不打包）
      - ../../digital_human_engine/checkpoints_v2:/app/digital_human_engine/checkpoints_v2:ro
      # MediaPipe 人脸特征点模型
      - ../../models:/app/models:ro
      # ModelScope 模型缓存（FunASR 首次下载后复用）
      - modelscope-cache:/app/cache
      - asr-cache:/app/models/asr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# ── 持久化数据卷 ────────
volumes:
  app-data:
    driver: local
  asr-cache:
    driver: local
  modelscope-cache:
    driver: local
