<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字心屿 · 运营后台</title>
<style>
:root{color-scheme:light;--ink:#18233f;--muted:#71809e;--line:#dfe8f6;--blue:#4f86ef;--violet:#7b62d7;--card:rgba(255,255,255,.82)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px/1.55 Inter,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#d7edff 0,transparent 35%),radial-gradient(circle at 100% 20%,#ece3ff 0,transparent 38%),#f3f7fc}
.shell{max-width:1440px;margin:auto;padding:30px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:14px;align-items:center}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;color:white;font-size:22px;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 12px 30px #5e78d344}.top h1{font-size:25px;margin:0}.top p{margin:2px 0 0;color:var(--muted)}.back,.refresh{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 15px;color:var(--ink);cursor:pointer;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card,.panel{border:1px solid rgba(255,255,255,.9);background:var(--card);box-shadow:0 15px 45px rgba(53,75,118,.08);backdrop-filter:blur(18px)}.card{border-radius:18px;padding:18px}.card span{color:var(--muted)}.card strong{display:block;margin-top:8px;font-size:25px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.panel{border-radius:22px;padding:22px}.panel h2{font-size:17px;margin:0 0 16px}.provider-list{display:grid;gap:12px}.provider{padding:14px;border-radius:15px;background:#f5f8fd;display:grid;grid-template-columns:1fr repeat(3,auto);gap:20px;align-items:center}.provider b{text-transform:capitalize}.metric small{display:block;color:var(--muted)}.bars{height:190px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding-top:16px}.day{flex:1;min-width:0;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:5px}.bar{width:100%;max-width:24px;min-height:3px;border-radius:7px 7px 2px 2px;background:linear-gradient(var(--blue),var(--violet))}.day small{font-size:10px;color:var(--muted)}.table-panel{margin-top:18px}.table-head{display:flex;justify-content:space-between;gap:16px;align-items:center}.table-head h2{margin-bottom:0}.search,.filter{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#f9fbff;color:var(--ink)}.search{width:260px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:600}td:first-child{font-weight:650}.role,.feedback-tag{font-size:12px;padding:4px 8px;border-radius:999px;background:#edf3ff;color:#456fc6}.role.admin{background:#eee8ff;color:#6849bd}.feedback-list{display:grid;gap:12px;margin-top:17px}.feedback-item{padding:16px;border:1px solid var(--line);border-radius:16px;background:#f8fbff}.feedback-meta,.feedback-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.feedback-meta{color:var(--muted);font-size:12px}.feedback-body{margin:10px 0;white-space:pre-wrap;word-break:break-word}.feedback-contact{font-size:12px;color:var(--muted)}.feedback-actions{justify-content:flex-end;margin-top:10px}.feedback-action{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:white;color:var(--ink);cursor:pointer}.feedback-action.primary{border-color:#bfd5ff;background:#edf4ff;color:#386bc8}.feedback-tag.new{background:#fff2d8;color:#986914}.feedback-tag.reviewed{background:#e8f2ff;color:#3d6eb9}.feedback-tag.resolved{background:#e7f8ef;color:#268158}.empty{text-align:center;color:var(--muted);padding:35px}.notice{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff7df;color:#765b15}.privacy{color:var(--muted);margin:16px 2px 0}.error{background:#fff0f1;color:#b43a47}.loading{opacity:.55;pointer-events:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.table-panel{overflow:auto}.top{align-items:flex-start;gap:12px}.top>div:last-child{display:grid;gap:8px}.provider{grid-template-columns:1fr 1fr}.search{width:170px}.feedback-panel{overflow:visible}.table-head{align-items:flex-start}.feedback-actions{justify-content:flex-start}}
</style></head>
<body><main class="shell" id="app">
<header class="top"><div class="brand"><div class="mark">✦</div><div><h1>运营数据中心</h1><p>数字心屿 · 仅管理员可见</p></div></div><div><button class="refresh" onclick="loadAll()">刷新数据</button> <a class="back" href="/">返回数字人</a></div></header>
<section class="cards" id="cards"></section>
<section class="grid"><article class="panel"><h2>对话模型调用概览</h2><div class="provider-list" id="providers"></div><div class="notice" id="price-note"></div></article><article class="panel"><h2>最近 14 天对话轮次</h2><div class="bars" id="daily"></div></article></section>
<section class="panel table-panel"><div class="table-head"><h2>注册用户</h2><input class="search" id="search" placeholder="搜索用户名或邮箱" oninput="queueSearch()"></div><div id="users"></div></section>
<section class="panel table-panel feedback-panel"><div class="table-head"><div><h2>用户反馈信箱</h2><p style="margin:4px 0 0;color:var(--muted)">集中查看用户提交的 Bug、体验问题与新想法。</p></div><select class="filter" id="feedback-filter" onchange="loadFeedback()"><option value="">全部反馈</option><option value="new">待处理</option><option value="reviewed">已查看</option><option value="resolved">已解决</option></select></div><div class="feedback-list" id="feedbacks"></div></section>
<p class="privacy" id="privacy"></p>
</main>
<script>
const token=(document.cookie.match(/(?:^|; )auth_token=([^;]*)/)||[])[1]||'';
const app=document.getElementById('app'),cards=document.getElementById('cards');
const providers=document.getElementById('providers'),priceNote=document.getElementById('price-note');
const daily=document.getElementById('daily'),users=document.getElementById('users');
const feedbacks=document.getElementById('feedbacks'),feedbackFilter=document.getElementById('feedback-filter');
const searchInput=document.getElementById('search'),privacy=document.getElementById('privacy');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const number=v=>new Intl.NumberFormat('zh-CN').format(Number(v)||0);
const money=v=>'¥'+Number(v||0).toFixed(4);
async function api(path,options={}){const headers={'X-Auth-Token':decodeURIComponent(token),...(options.headers||{})};const r=await fetch(path,{...options,headers});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求失败');return data}
function renderSummary(data){const t=data.totals,items=[['注册用户',t.users],['近7日新增',t.new_users_7d],['近7日活跃',t.active_users_7d],['会话总数',t.sessions],['对话轮次',t.dialogue_rounds],['模型估算费用',money(t.estimated_cost_cny)]];cards.innerHTML=items.map(([k,v])=>`<div class="card"><span>${k}</span><strong>${typeof v==='number'?number(v):v}</strong></div>`).join('');providers.innerHTML=data.providers.length?data.providers.map(p=>`<div class="provider"><b>${esc(p.provider)}</b><div class="metric"><small>调用</small>${number(p.calls)}</div><div class="metric"><small>Token</small>${number(p.input_tokens+p.output_tokens)}</div><div class="metric"><small>估算费用</small>${money(p.estimated_cost_cny)}</div></div>`).join(''):'<div class="empty">新的模型调用将在这里开始统计</div>';const configured=Object.entries(data.pricing).filter(([,v])=>v.configured).map(([k])=>k);priceNote.textContent=configured.length===Object.keys(data.pricing).length?'费用按服务器配置的模型单价估算，最终以平台账单为准。':'调用次数与 Token 已统计；尚未配置完整模型单价，因此费用可能显示为 ¥0。';const max=Math.max(1,...data.daily.map(x=>x.dialogue_rounds));daily.innerHTML=data.daily.map(x=>`<div class="day" title="${x.day} · ${x.dialogue_rounds}轮"><div>${number(x.dialogue_rounds)}</div><div class="bar" style="height:${Math.max(3,x.dialogue_rounds/max*135)}px"></div><small>${x.day.slice(5)}</small></div>`).join('');privacy.textContent=data.privacy}
function renderUsers(data){users.innerHTML=data.users.length?`<table><thead><tr><th>用户</th><th>邮箱</th><th>权限</th><th>注册时间</th><th>最近活跃</th><th>会话</th><th>对话轮次</th><th>模型调用</th><th>Token</th><th>估算费用</th></tr></thead><tbody>${data.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.email||'—')}</td><td><span class="role ${u.role==='admin'?'admin':''}">${u.role==='admin'?'管理员':'普通用户'}</span></td><td>${esc(u.created_at)}</td><td>${esc(u.last_active_at)}</td><td>${number(u.sessions)}</td><td>${number(u.dialogue_rounds)}</td><td>${number(u.model_calls)}</td><td>${number(u.input_tokens+u.output_tokens)}</td><td>${money(u.estimated_cost_cny)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有匹配的用户</div>'}
const feedbackLabels={bug:'Bug / 故障',suggestion:'功能建议',experience:'体验感受',other:'其他'},statusLabels={new:'待处理',reviewed:'已查看',resolved:'已解决'};
function renderFeedback(data){feedbacks.innerHTML=data.feedback.length?data.feedback.map(item=>`<article class="feedback-item"><div class="feedback-meta"><span class="feedback-tag">${esc(feedbackLabels[item.category]||item.category)}</span><span class="feedback-tag ${esc(item.status)}">${esc(statusLabels[item.status]||item.status)}</span><b>${esc(item.username)}</b><span>${esc(item.email||'未绑定邮箱')}</span><span>${esc(item.created_at)}</span></div><div class="feedback-body">${esc(item.content)}</div>${item.contact?`<div class="feedback-contact">联系方式：${esc(item.contact)}</div>`:''}<div class="feedback-actions">${item.status!=='reviewed'?`<button class="feedback-action" onclick="updateFeedback(${Number(item.id)},'reviewed')">标记已查看</button>`:''}${item.status!=='resolved'?`<button class="feedback-action primary" onclick="updateFeedback(${Number(item.id)},'resolved')">标记已解决</button>`:''}</div></article>`).join(''):'<div class="empty">当前筛选条件下还没有反馈</div>'}
let timer;function queueSearch(){clearTimeout(timer);timer=setTimeout(loadUsers,250)}
async function loadUsers(){renderUsers(await api('/api/admin/users?search='+encodeURIComponent(searchInput.value)))}
async function loadFeedback(){renderFeedback(await api('/api/admin/feedback?status='+encodeURIComponent(feedbackFilter.value)))}
async function updateFeedback(id,status){await api('/api/admin/feedback/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await loadFeedback()}
async function loadAll(){app.classList.add('loading');try{const [summary,userData,feedbackData]=await Promise.all([api('/api/admin/summary'),api('/api/admin/users'),api('/api/admin/feedback')]);renderSummary(summary);renderUsers(userData);renderFeedback(feedbackData)}catch(e){app.classList.remove('loading');app.innerHTML=`<div class="panel error"><h2>无法访问运营后台</h2><p>${esc(e.message)}</p><a class="back" href="/">返回登录</a></div>`;return}app.classList.remove('loading')}
loadAll();
</script></body></html>
